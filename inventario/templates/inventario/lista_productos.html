<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetCare Store</title>
</head>
<body>
    <h1>Bienvenido a PetCare Store</h1>
    <h2>Nuestro Inventario Disponible:</h2>
    
    <ul>
        {% for producto in productos %}
            <li>
                <strong>{{ producto.nombre }}</strong> - {{ producto.marca }} 
                <br> Precio: ${{ producto.precio }} | Stock: {{ producto.stock }}
            </li>
        {% empty %}
            <li>No hay productos disponibles en este momento.</li>
        {% endfor %}
    </ul>
</body>
</html>
